<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Видеоплеер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #player {
            width: 800px;
            height: 600px;
            background: black;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);

            display: flex;
            flex-direction: column;
        }

        .js-video-container {
            flex: 1;
            background: black;
        }

        .controls-panel {
            background: black;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .custom-button {
            border: none;
            cursor: pointer;
            background: none;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            font-size: 24px;
            padding: 0;
            line-height: 1;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .custom-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .spacer {
            flex: 1;
        }

        .custom-button[hidden] {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="player">
    <div class="js-video-container"></div>

    <div class="controls-panel">
        <button class="js-play-button custom-button">▶</button>
        <button class="js-pause-button custom-button" hidden>⏸</button>

        <button class="js-mute-button custom-button">🔇</button>
        <button class="js-volume-button custom-button" hidden>🔊</button>

        <div class="spacer"></div>

        <button class="js-fullscreen-button custom-button">⛶</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
<script src="player.js"></script>

<script>
    createPlayer({
        elementId: 'player',
        src: 'https://dvmn.org/media/filer_public/d0/16/d016d9b8-4180-4bb9-ad83-0241f61627b8/samsung_demo_-_alive_in_color.mp4'
    });
</script>

</body>
</html>
