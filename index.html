<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #player {
            width: 90%;
            max-width: 1100px;
            min-width: 280px;
            background: black;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .js-video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
        }

        .controls-panel {
            background: black;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .player-button {
            border: none;
            cursor: pointer;
            background: none;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            font-size: 28px;
            padding: 0;
            line-height: 1;
        }

        .player-button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div id="player">
    <div class="js-video-container"></div>
    <div class="controls-panel">
        <button class="js-play-button player-button">▶</button>
        <button class="js-pause-button player-button" hidden>⏸</button>
        <button class="js-mute-button player-button">🔇</button>
        <button class="js-volume-button player-button" hidden>🔊</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
<script src="player.js"></script>

<script>
    createPlayer({
        elementId: 'player',
        src: 'https://dvmn.org/media/filer_public/d0/16/d016d9b8-4180-4bb9-ad83-0241f61627b8/samsung_demo_-_alive_in_color.mp4'
    });
</script>

</body>
</html>
