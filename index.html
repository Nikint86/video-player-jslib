<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Видеоплеер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #player {
            width: 800px;
            height: 600px;
            background: black;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .video-container {
            flex: 1;
            background: black;
        }

        .controls-panel {
            background: black;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .buttons-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .timeline {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .buttons-right {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .player-btn {
            border: none;
            cursor: pointer;
            background: none;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 24px;
            font-size: 16px;
            padding: 0;
            line-height: 1;
            transition: opacity 0.2s;
        }

        .player-btn:hover {
            opacity: 0.7;
        }

        .player-btn:focus,
        .player-btn:focus-visible,
        .player-btn:active {
            outline: none;
            box-shadow: none;
        }

        .time {
            color: white;
            font-family: 'Roboto', monospace;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .progress {
            flex: 1;
            height: 4px;
            background: black;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            width: 0%;
            height: 100%;
            background: #FF3B30;
            border-radius: 2px;
            position: relative;
        }

        .progress-filled::after {
            content: '';
            position: absolute;
            right: -4.5px;
            top: 50%;
            transform: translateY(-50%);
            width: 9px;
            height: 9px;
            background: #FF3B30;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            opacity: 0;
            visibility: hidden;
        }

        .progress:hover .progress-filled::after {
            opacity: 1;
            visibility: visible;
        }

        .progress-filled::after:hover {
            transform: translateY(-50%) scale(1.2);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="player">
    <div class="js-video-container video-container"></div>

    <div class="controls-panel">
        <div class="buttons-left">
            <button class="js-play-button player-btn"><i class="fas fa-play"></i></button>
            <button class="js-pause-button player-btn" hidden><i class="fas fa-pause"></i></button>

            <button class="js-volume-button player-btn"><i class="fas fa-volume-up"></i></button>
            <button class="js-mute-button player-btn" hidden><i class="fas fa-volume-mute"></i></button>
        </div>

        <div class="timeline">
            <span class="js-current-time time">0:00:00</span>
            <div class="js-progress progress">
                <div class="js-progress-slider progress-filled"></div>
            </div>
            <span class="js-duration time">0:00:00</span>
        </div>

        <div class="buttons-right">
            <button class="js-fullscreen-button player-btn"><i class="fas fa-expand"></i></button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
<script src="player.js"></script>

<script>
    createPlayer({
        elementId: 'player',
        src: 'https://dvmn.org/media/filer_public/d0/16/d016d9b8-4180-4bb9-ad83-0241f61627b8/samsung_demo_-_alive_in_color.mp4'
    });
</script>

</body>
</html>
