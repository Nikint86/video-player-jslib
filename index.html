<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Видеоплеер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #player {
            width: 800px;
            height: 600px;
            background: black;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .js-video-container {
            flex: 1;
            background: black;
        }

        .controls-panel {
            background: black;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            margin-left: -8px;
        }

        .left-group {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-shrink: 0;
        }

        .right-group {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-shrink: 0;
        }

        .progress-wrapper {
            flex: 1;
            display: flex;
            justify-content: flex-start;
            margin: 0 16px;
        }

        .progress-bar {
            width: 24%;
            height: 4px;
            background: black;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-slider {
            width: 0%;
            height: 100%;
            background: #FF3B30;
            border-radius: 2px;
            position: relative;
        }

        .progress-slider::after {
            content: '';
            position: absolute;
            right: -4.5px;
            top: 50%;
            transform: translateY(-50%);
            width: 9px;
            height: 9px;
            background: #FF3B30;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s ease, transform 0.2s ease, visibility 0.3s ease;
            opacity: 0;
            visibility: hidden;
        }

        .progress-bar:hover .progress-slider::after {
            opacity: 1;
            visibility: visible;
        }

        .progress-slider::after:hover {
            transform: translateY(-50%) scale(1.2);
            transition: transform 0.15s ease;
        }

        .custom-button {
            border: none;
            cursor: pointer;
            background: none;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 24px;
            font-size: 16px;
            padding: 0;
            line-height: 1;
            border-radius: 0;
            transition: background 0.2s;
            position: relative;
            top: 2px;
        }

        .custom-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .js-volume-button,
        .js-mute-button {
            margin-left: 0;
        }

        .time-current {
            color: white;
            font-family: 'Roboto', monospace;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.5px;
            position: relative;
            top: 2px;
            margin-left: -16px;
        }

        .time-duration {
            color: white;
            font-family: 'Roboto', monospace;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-right: -12px;
            position: relative;
            top: 2px;
        }

        .custom-button[hidden] {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="player">
    <div class="js-video-container"></div>

    <div class="controls-panel">
        <div class="left-group">
            <button class="js-play-button custom-button"><i class="fas fa-play"></i></button>
            <button class="js-pause-button custom-button" hidden><i class="fas fa-pause"></i></button>

            <button class="js-mute-button custom-button"><i class="fas fa-volume-mute"></i></button>
            <button class="js-volume-button custom-button" hidden><i class="fas fa-volume-up"></i></button>

            <span class="js-current-time time-current">0:00:00</span>
        </div>

        <div class="progress-wrapper">
            <div class="js-progress progress-bar">
                <div class="js-progress-slider progress-slider"></div>
            </div>
        </div>

        <div class="right-group">
            <span class="js-duration time-duration">0:00:00</span>
            <button class="js-fullscreen-button custom-button"><i class="fas fa-expand"></i></button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
<script src="player.js"></script>

<script>
    createPlayer({
        elementId: 'player',
        src: 'https://dvmn.org/media/filer_public/d0/16/d016d9b8-4180-4bb9-ad83-0241f61627b8/samsung_demo_-_alive_in_color.mp4'
    });
</script>

</body>
</html>
