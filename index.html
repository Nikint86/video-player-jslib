<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        #player {
            width: 800px;
            height: 450px;
            position: relative;
            background: black;
        }
        .js-video-container {
            width: 100%;
            height: 100%;
        }

        .controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 12px;
        }

        .js-play-button,
        .js-pause-button {
            border: none;
            cursor: pointer;
            color: white;
            background: none;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            padding: 0;
            line-height: 1;
        }

        .js-pause-button {
            font-size: 22px;
        }
    </style>
</head>
<body>

<div id="player" style="width: 800px; height: 450px;">
    <div class="js-video-container" style="width: 100%; height: 100%"></div>

    <div class="controls-panel">
        <button class="js-play-button">▶</button>
        <button class="js-pause-button" hidden>⏸</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
<script src="player.js"></script>

<script>
    createPlayer({
        elementId: 'player',
        src: 'https://dvmn.org/media/filer_public/d0/16/d016d9b8-4180-4bb9-ad83-0241f61627b8/samsung_demo_-_alive_in_color.mp4'
    });
</script>

</body>
</html>
